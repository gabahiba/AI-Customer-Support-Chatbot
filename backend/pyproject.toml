[project]
name = "ai-customer-support-api"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "databases>=0.9.0",
    "aiosqlite>=0.20.0",
    "SQLAlchemy>=2.0.36",
    "google-generativeai>=0.8.0",
    "pypdf>=5.1.0",
    "python-multipart>=0.0.20",
    "fastembed>=0.5.0",
]

[tool.vercel]
entrypoint = "main:app"